name: CI

# Builds, packs and validates the plugin on every push and pull request.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, pack and validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest mirrors the Store release workflow, which cross-builds win-x64 on Linux.
        os: [ windows-latest, ubuntu-latest ]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AppVolumeMixer.slnx -c Release

      - name: Install the plugin CLI
        shell: pwsh
        run: |
          dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.17
          Join-Path $HOME '.dotnet' 'tools' | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Pack and validate
        shell: pwsh
        run: |
          macrodeck-plugin build --source src/AppVolumeMixer --output "$env:RUNNER_TEMP/artifacts" --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifact = Get-ChildItem "$env:RUNNER_TEMP/artifacts" -Filter *.macroDeckPlugin | Select-Object -First 1
          macrodeck-plugin validate --level publication --artifact $artifact.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ARTIFACT=$($artifact.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The same suite the Store's release workflow runs on its stub host. win-x64 only runs on Windows.
      - name: Conformance suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'conformance.json'
          macrodeck-plugin test --artifact $env:ARTIFACT --report json --output $report
          $code = $LASTEXITCODE
          $r = Get-Content $report -Raw | ConvertFrom-Json
          "Conformant: $($r.conformant) - passed $($r.passed), failed $($r.failed), skipped $($r.skipped)"
          foreach ($c in $r.results) {
            if ($c.result.outcome -eq 'failed') {
              "::error title=$($c.id) $($c.requirement)::$($c.title) | expected: $($c.result.expected) | actual: $($c.result.actual)"
            }
          }
          if (-not $r.conformant -or $code -ne 0) { exit 1 }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: app-volume-mixer-${{ matrix.os }}
          path: ${{ env.ARTIFACT }}
          retention-days: 14
          if-no-files-found: error
